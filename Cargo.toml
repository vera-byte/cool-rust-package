[workspace]
resolver = "2"
members = [
    "cool-core",
    "cool-macros",
    "cool-rpc",
    "cool-task",
    "cool-es",
    "cool-plugin",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["COOL <cool@cool-js.com>"]
license = "MIT"
repository = "https://cool-js.com"
description = "一个很酷的 Rust 版 AI 快速开发框架"

[workspace.dependencies]
# Web 框架
salvo = { version = "0.85", features = [
    "cors",
    "logging",
    "jwt-auth",
    "cache",
    "oapi",
] }

# ORM
sea-orm = { version = "1.1", features = [
    "sqlx-mysql",
    "sqlx-postgres",
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
sea-orm-migration = "1.1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 验证
validator = { version = "0.20.0", features = ["derive"] }

# 缓存
redis = { version = "1.0.1", features = ["tokio-comp", "connection-manager"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# JWT
jsonwebtoken = "10.2.0"

# 工具
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
once_cell = "1"
parking_lot = "0.12"
rand = "0.9.2"
regex = "1"
url = "2"

# 过程宏
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
darling = "0.23.0"

# 内部依赖（定义版本和 path，自动跟随 workspace.package.version）
# 注意：版本号需要手动与 workspace.package.version 保持一致
cool-core = { path = "cool-core", version = "0.1.2" }
cool-macros = { path = "cool-macros", version = "0.1.2" }
cool-task = { path = "cool-task", version = "0.1.2" }
cool-rpc = { path = "cool-rpc", version = "0.1.2" }
cool-es = { path = "cool-es", version = "0.1.2" }
cool-plugin = { path = "cool-plugin", version = "0.1.2" }
